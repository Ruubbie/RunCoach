name: RunCoach
options:
  bundleIdPrefix: nl.ruben
  deploymentTarget:
    iOS: "17.0"
targets:
  RunCoach:
    type: application
    platform: iOS
    sources: [RunCoach]
    scheme: {}
    info:
      path: RunCoach/Info.plist
      properties:
        CFBundleDisplayName: "run."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: "run. uses GPS to track distance and pace during your runs."
        NSLocationAlwaysAndWhenInUseUsageDescription: "run. uses GPS to keep tracking your run while the screen is locked."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.ruben.runcoach
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
